<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - RagLeo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600;1,9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 48px 20px;
            text-align: center;
        }

        .error-code {
            font-family: var(--font-display);
            font-size: clamp(4.5rem, 14vw, 7.5rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--bad);
            margin-bottom: 18px;
        }

        .error-title {
            font-size: clamp(1.6rem, 3.4vw, 2.2rem);
            letter-spacing: -0.025em;
            color: var(--ink);
            margin-bottom: 12px;
        }

        .error-message {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--ink-2);
            max-width: 560px;
            margin-bottom: 32px;
        }

        .error-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-code">{{ error_code or '500' }}</div>
        <h1 class="error-title">{{ error_title or 'Something went wrong' }}</h1>
        <p class="error-message">
            {{ error_message or 'An unexpected error occurred. Please try again later.' }}
        </p>
        <div class="error-actions">
            <button class="btn btn-primary" onclick="window.location.href='/'">
                🏠 Go Home
            </button>
            <button class="btn btn-secondary" onclick="window.history.back()">
                ← Go Back
            </button>
        </div>
    </div>
</body>

</html>
